숙박이 항공보다 먼저 매진"]], "음식숙소주의": [["특산음식", "후라노 멜론(홋카이도 멜론 최고급) / 후라노 와인(서늘한 기후 포도) / 팜 도미타 라벤더 소프트아이스크림 / 후라노 치즈"], ["숙박 분포", "후라노 시내: 비즈니스호텔·펜션. 비에이: 소규모 B&B·팜 숙박. 성수기 팜 도미타 인근 조기 마감. 펜션 1박 7,000~15,000엔."], ["주의사항", "① 렌터카 없으면 이동 매우 불편 — 국제면허 필수. ② 라벤더 개화: 해마다 다름 — Farm Tomita 공식 사이트 확인. ③ 비에이 언덕 일부: 사유지, 진입 금지."]], "연계": [["여행 패턴", "삿포로 거점 렌터카 1~2박. 홋카이도 일주 중간 경유지."], ["주요 연계 도시", "① 삿포로: 렌터카 약 2시간. ② 아사히카와: 차량 약 40분. ③ 노보리베츠: 렌터카 약 2.5시간."], ["추천 조합", "삿포로3+후라노·비에이1~2박 / 홋카이도 7박 전체 일주"]]}, "구마모토·나가사키": {"항공권": [["기준 가격", "후쿠오카 직항+신칸센 조합: 비수기 30만원대~ / 성수기 55만원대~"], ["성수기 (1.5~2배 상승)", "① 벚꽃: 3월 4주~4월 1주 ② 골든위크: 4월 4주~5월 1주 ③ 하우스텐보스 빛 축제: 11월~3월"], ["비수기 (최저가)", "1~2월·6~7월 장마"], ["예약 시기", "성수기: 2~3개월 전"], ["가격 변수", "후쿠오카 직항 후 신칸센 이동이 가장 편리 / 구마모토or나가사키 직항(제한적) vs 후쿠오카 경유 비교"]], "음식숙소주의": [["특산음식", "나가사키 짬뽕(중국인 화교가 만든 원조 짬뽕) / 나가사키 카스텔라(포르투갈 영향 스펀지 케이크) / 구마모토 말고기(바사시, 규슈 특산) / 구마모토 라멘(마늘+돼지뼈)"], ["숙박 분포", "후쿠오카 거점 당일치기 or 현지 1박. 나가사키 시내 비즈니스 7,000~13,000엔. 하우스텐보스 내 호텔 성수기 폭등."], ["주의사항", "① 원폭 자료관·평화공원: 진지한 방문 태도 필요. ② 하우스텐보스 성수기: 줄 1~2시간. 익스프레스패스 구매 추천. ③ 아소산 접근: 화산 활동 레벨 확인 필수."]], "연계": [["여행 패턴", "후쿠오카 거점 당일치기 or 규슈 일주 포함"], ["주요 연계 도시", "① 후쿠오카: 신칸센 구마모토 40분·나가사키 약 1시간 20분. ② 벳푸·유후인: 특급 약 2시간. ③ 가고시마: 신칸센 약 1시간."], ["추천 조합", "후쿠오카2+구마모토1+나가사키1 / 규슈 6박 일주"]]}, "다카야마": {"항공권": [["기준 가격", "나고야 직항+특급 조합: 비수기 30만원대~ / 성수기 55만원대~"], ["성수기 (1.5~2배 상승)", "① 벚꽃: 4월 1~2주 ② 단풍: 10월 3주~11월 1주 ③ 겨울 설경: 1~2월"], ["비수기 (최저가)", "6~7월 장마 / 9월"], ["예약 시기", "성수기 료칸: 2~3개월 전"], ["가격 변수", "나고야 or 도쿄 경유 특급히다 / 가나자와와 연계 시 버스 이동"]], "음식숙소주의": [["특산음식", "히다규(히다 소고기, 마블링 최고급) / 미타라시당고(간장 소스 경단) / 호박(다카야마 특산 채소) / 사루보보 인형(빨간 원숭이 기념품)"], ["숙박 분포", "산마치스지 인근: 전통 료칸·부티크. 게스트하우스: 3,000~7,000엔. 료칸 1박 2식: 15,000~50,000엔."], ["주의사항", "① 시라카와고 연계: 버스 예약 필수(좌석 한정). ② 다카야마 마쓰리(봄4월·가을10월): 일본 3대 아름다운 마쓰리, 기간 중 숙박 폭등. ③ 겨울 적설: 방한화 필수."]], "연계": [["여행 패턴", "가나자와↔다카야마↔시라카와고 호쿠리쿠·히다 루트"], ["주요 연계 도시", "① 나고야: 특급히다 약 2.5시간. ② 가나자와: 버스 약 2.5시간. ③ 시라카와고: 버스 약 50분. ④ 도쿄: 신칸센+특급 약 4시간."], ["추천 조합", "가나자와2+다카야     let h=`<div class="row-item"><div class="row-k">최적 시기</div><div class="row-v">${city.best}</div></div><div class="row-item"><div class="row-k">비자<span class="vchg" title="${VTIP}">변동</span></div><div class="row-v">${city.visa}</div></div><div class="row-item"><div class="row-k">항공<span class="vchg" title="${VTIP}">변동</span></div><div class="row-v">${city.flight}</div></div>`;
    return h+renderRows(city.sections,color);
  };
  const flightBody=()=>(!ex||!ex['항공권'])?noData:`<div class="summary-txt">항공권 가격·성수기·운항 정보는 모두 수시로 바뀝니다. 예약 시점 실제 운임으로 재확인하세요.</div>`+kvRows(ex['항공권'],false);
  const foodBody=()=>(!ex||!ex['음식숙소주의'])?noData:kvRows(ex['음식숙소주의']);
  const routeBody=()=>(!ex||!ex['연계'])?noData:kvRows(ex['연계']);
  document.getElementById('main').innerHTML=`<div class="cscreen">
    <div class="bc"><span onclick="showHome()">🏠 홈</span><span class="bc-sep">›</span>
      <span style="color:${color}">${emoji} ${city.region}</span><span class="bc-sep">›</span>
      <span style="font-weight:700">${name}</span></div>
    <div class="chero" style="background:linear-gradient(135deg,${color}cc,${color}88)">
      <h2>${emoji} ${name}</h2><div class="sub">${city.region}</div>
      <div class="badges">
        <span class="cbadge">🕐 ${city.best}</span>
        <span class="cbadge">🛂 ${city.visa}</span>
        <span class="cbadge">✈ ${city.flight}</span>
      </div>
      <div style="margin-top:12px">
        <button onclick="generateCityHTML('${name}')"
          style="background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600">
          📤 이 도시 가이드 저장
        </button>
      </div>
    </div>
    <div class="vnote"><span class="vchg" style="margin:0 4px 0 0">변동</span> 표시는 요금·비자·항공편·환율 등 수시로 바뀌는 정보입니다. 출발 전 반드시 재확인하세요. (2026년 10월 기준)</div>
    ${panel('①','#1c1c2e','해외여행 공통 준비사항',comBody,false)}
    ${reg?panel('②',color,`${emoji} ${regKey} 지역 안내`,regBody,false):''}
    ${panel('③',color,`${name} 핵심 명소 & 상세 가이드`,cityBody,true)}
    ${panel('④','#6c3483','항공권 & 성수기<span class="vchg">변동</span>',flightBody,false)}
    ${panel('⑤','#1a5276','특산음식 · 숙소 · 주의사항',foodBody,false)}
    ${panel('⑥','#145a32','단일 vs 연계 여행',routeBody,false)}
  </div>`;
  document.getElementById('main').scrollTop=0;
}

function showHome(){
  document.querySelectorAll('.scb').forEach(b=>b.classList.remove('on'));
  const rg={};
  for(const[c,d]of Object.entries(C))rg[d.region]=(rg[d.region]||[]).concat(c);
  let cards='';
  for(const r of REGION_ORDER){
    const cnt=(rg[r]||[]).length;if(!cnt)continue;
    const color=rc(r),emoji=re(r),light=hex2rgba(color,.1),sid='rg_'+r.replace(/[·\s]/g,'_');
    cards+=`<div class="rg-card" style="background:${light};color:${color}" onclick="tRG('${sid}')">
      <div class="emo">${emoji}</div><div class="nm">${r}</div><div class="ct">${cnt}개 도시</div></div>`;
  }
  let rows='';
  for(const r of REGION_ORDER){
    const cities=(rg[r]||[]).sort();if(!cities.length)continue;
    const color=rc(r),emoji=re(r),light=hex2rgba(color,.1),sid='rg_'+r.replace(/[·\s]/g,'_');
    const pills=cities.map(c=>`<span class="cpill" style="background:${light};color:${color};border-color:${color}30" onclick="showCity('${c}')">${c}</span>`).join('');
    rows+=`<div class="rg-open" id="${sid}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:16px">${emoji}</span><strong style="font-size:14px;color:${color}">${r}</strong></div>
      <div class="rg-cities-row">${pills}</div></div>`;
  }
  document.getElementById('main').innerHTML=`<div class="home">
    <h2>여행 가이드 전체 목록</h2>
    <p>도시 선택 시 ① 공통 준비 → ② 지역 안내 → ③ 핵심 명소 → ④ 항공권·성수기 → ⑤ 음식·숙소·주의사항 → ⑥ 연계 여행 순으로 정리됩니다.</p>
    <div class="rg-grid">${cards}</div>${rows}</div>`;
}

function tRG(id){document.getElementById(id)?.classList.toggle('show');}
function tSG(id){document.getElementById('sg_'+id)?.classList.toggle('open');}
function toggleSidebar(){document.querySelector('.sidebar').classList.toggle('open');document.getElementById('sb-overlay').classList.toggle('show');}
function closeSidebar(){document.querySelector('.sidebar').classList.remove('open');document.getElementById('sb-overlay').classList.remove('show');}
document.addEventListener('click',function(e){const btn=e.target.closest('.scb');if(btn&&window.innerWidth<=600)closeSidebar();});

const allCities=Object.keys(C);
document.getElementById('si').addEventListener('input',function(){
  const q=this.value.trim(),sd=document.getElementById('sd');
  if(!q){sd.classList.remove('on');return;}
  const m=allCities.filter(c=>c.includes(q)||C[c].region.includes(q));
  if(!m.length){sd.classList.remove('on');return;}
  sd.innerHTML=m.slice(0,12).map(c=>`<div class="sri" onclick="showCity('${c}');this.closest('.srch-drop').classList.remove('on');document.getElementById('si').value=''">
    <span class="sc">${c}</span><span class="sr">${re(C[c].region)} ${C[c].region}</span></div>`).join('');
  sd.classList.add('on');
});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))document.getElementById('sd').classList.remove('on');});
